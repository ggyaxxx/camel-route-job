apiVersion: v1
kind: Pod
metadata:
  name: shared-test-pod
  namespace: camel-rotta
spec:
  containers:
    - name: tester
      image: registry.access.redhat.com/ubi8/ubi-minimal
      command: [ "tail", "-f", "/dev/null" ]
      volumeMounts:
        - name: shared-volume
          mountPath: /mnt/shared
  volumes:
    - name: shared-volume
      persistentVolumeClaim:
        claimName: shared-pvc
  restartPolicy: Never
