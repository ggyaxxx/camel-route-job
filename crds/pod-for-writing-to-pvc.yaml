apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-pvc-test
  namespace: camel-rotta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shared-pvc-test
  template:
    metadata:
      labels:
        app: shared-pvc-test
    spec:
      containers:
        - name: tester
          image: registry.access.redhat.com/ubi8/ubi-minimal
          command: [ "tail", "-f", "/dev/null" ]
          volumeMounts:
            - name: shared-volume
              mountPath: /mnt/shared
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-pvc
